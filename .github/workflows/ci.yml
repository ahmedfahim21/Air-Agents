name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: AirAgentsCore (swift test)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/AirAgentsCore

  functions:
    name: Functions (deno test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test
        working-directory: supabase/functions
